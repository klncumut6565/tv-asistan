name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını hazırla
        env:
          IMZA_KEYSTORE_B64: ${{ secrets.IMZA_KEYSTORE_B64 }}
        run: |
          if [ -z "$IMZA_KEYSTORE_B64" ]; then
            echo "::error::IMZA_KEYSTORE_B64 / IMZA_SIFRE secret'ları eksik (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$IMZA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/imza.jks"

      - name: APK derle
        env:
          IMZA_DOSYASI: ${{ runner.temp }}/imza.jks
          IMZA_SIFRE: ${{ secrets.IMZA_SIFRE }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/imza.jks"

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk tv-asistan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-asistan-apk
          path: tv-asistan.apk

      - name: GitHub Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: TV Asistan 0.1.${{ github.run_number }}
          files: tv-asistan.apk
          make_latest: true
