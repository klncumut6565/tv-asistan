name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk tv-asistan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-asistan-apk
          path: tv-asistan.apk

      - name: GitHub Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: TV Asistan 0.1.${{ github.run_number }}
          files: tv-asistan.apk
          make_latest: true
